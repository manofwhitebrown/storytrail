name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check the game is really inside the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          unzip -l "$APK" | grep -q "assets/public/index.html"
          unzip -l "$APK" | grep -q "assets/capacitor.config.json"
          echo "APK contains the game."

      - uses: actions/upload-artifact@v4
        with:
          name: storytrail-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/app/build/reports
            android/build/reports
          if-no-files-found: ignore
