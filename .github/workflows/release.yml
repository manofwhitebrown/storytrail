name: Release AAB

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Check the signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v (see docs/release.md)"; exit 1; fi
          done

      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Check it is signed and contains the game
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          unzip -l "$AAB" | grep -q "assets/public/index.html"
          unzip -l "$AAB" | grep -q "META-INF/.*\.\(RSA\|SF\)"

      - uses: actions/upload-artifact@v4
        with:
          name: storytrail-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
