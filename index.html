<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoryTrail</title>
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/hud.css">
  <link rel="stylesheet" href="/styles/panels.css">
  <link rel="stylesheet" href="/styles/themes.css">
  <link rel="stylesheet" href="/styles/accessibility.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#243a63" />
</head>
<body data-phase="dusk" data-season="autumn">
  <main class="game">
    <header class="hud">
      <h1>StoryTrail</h1>
      <div class="stats">
        <span>Steps <strong id="steps">0</strong></span>
        <span>Tokens <strong id="tokens">0</strong></span>
        <span class="phase" id="phase" aria-label="Time of day"></span>
        <button id="journalBtn" type="button">Journal</button>
        <button id="mapBtn" type="button" class="hidden">Map</button>
        <button id="campBtn" type="button" class="hidden">Camp</button>
        <button id="menuBtn" type="button">Menu</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="game" width="800" height="450" aria-label="Walking game. Tap or press space to take a step."></canvas>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="tutorial" class="tutorial hidden" role="status" aria-live="polite"></div>
      <button id="secretPrompt" class="prompt hidden" type="button"></button>
      <div id="fade" class="fade" aria-hidden="true"></div>
      <!-- Panels (event, journal, map, menu...) are created by src/ui/panels.js -->
    </div>

    <p class="hint" id="hint">Tap the scene, or press space, to take a step.</p>
  </main>

  <script type="module" src="/src/core/main.js"></script>
</body>
</html>
